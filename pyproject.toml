[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbwarden-redis"
version = "0.1.0"
description = "Redis-backed distributed migration locking for DBWarden."
readme = "README.md"
requires-python = ">=3.12.7"
license = "MIT"
dependencies = [
    "dbwarden>=0.16.0",
    "redis>=5.0.0",
]
authors = [{ name = "Emiliano Gandini Outeda", email = "emiliano@emiliano-go.com" }]

[project.optional-dependencies]
async = ["redis[asyncio]>=5.0.0"]

[project.urls]
Homepage = "https://github.com/dbwarden-org/dbwarden-redis"
Source = "https://github.com/dbwarden-org/dbwarden-redis"

[project.entry-points."dbwarden.plugins"]
redis = "dbwarden_redis:setup"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
